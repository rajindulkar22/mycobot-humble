mycobot_state_publisher:
  ros__parameters:
    port: /dev/ttyTHS1
    baud: 1000000
    publish_rate: 5.0

    max_joint_step_degrees: 5.0
    max_speed: 10
    joint_limit_margin_degrees: 2.0

    motion_enabled: false
    motion_timeout_seconds: 6.0
    position_tolerance_degrees: 1.5
    motion_poll_period_seconds: 0.2

    max_gripper_speed: 20
    gripper_motion_enabled: false
    gripper_timeout_seconds: 5.0
    gripper_settle_seconds: 2.0
    gripper_open_min_value: 90
    gripper_closed_max_value: 10

    # Visualization fallback: physically confirmed closed.
    gripper_initial_value: 0
    gripper_open_angle_radians: 0.15
    gripper_closed_angle_radians: -0.74

    multi_joint_motion_enabled: false

    coord_motion_enabled: false
    coord_min_x_mm: 50.0
    coord_max_x_mm: 280.0
    coord_min_y_mm: -200.0
    coord_max_y_mm: 200.0
    coord_min_z_mm: 20.0
    coord_max_z_mm: 250.0
    coord_tolerance_mm: 8.0
    coord_angle_tolerance_degrees: 8.0
    coord_tool_tolerance_degrees: 25.0