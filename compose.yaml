services:
  mycobot:
    build:
      context: .
      dockerfile: Dockerfile
    image: mycobot-humble:local
    container_name: mycobot-humble-jetson

    network_mode: host
    ipc: host

    devices:
      - /dev/ttyTHS1:/dev/ttyTHS1
      - /dev/v4l/by-id/usb-SunplusIT_Inc_HP_320_FHD_Webcam_YJGD325HP20211201V0-video-index0:/dev/video0
      - /dev/v4l/by-id/usb-Generic_USB_2.0_Camera_20220523-video-index0:/dev/video1

    volumes:
      - ./mycobot_ws:/root/mycobot_ws

    working_dir: /root/mycobot_ws
    stdin_open: true
    tty: true
    command: bash